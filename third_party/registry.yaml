# inventoried and removed (third_party/source_pins.json). Q-08 (E05) and Q-09 (E04) are resolved by
# documented search: no official release was LOCATED as of 2026-09-21; a search cannot prove
# non-existence. This pin does NOT start M6 implementation. Full audit:
# outputs/audit/M6_BASELINE_SOURCE_PROVENANCE.md, M6_BASELINE_EXECUTION_CONTRACT_AUDIT.md,
