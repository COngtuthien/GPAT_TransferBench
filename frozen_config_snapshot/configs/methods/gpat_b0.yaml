method: GPAT-B0
supervision: binary_only
input_resolution: 256
wavelet: {library: ptwt, family: haar, level: 1, boundary_mode: reflect}
gamma: 0.0
artifact_encoder:
  backbone: torchvision_resnet18_imagenet1k_v1
  input_channels: 12
  highpass: {kernel: 9, sigma: 1.5}
  attack_type_head: false
  identity_adversary: false
residual_generator:
  name: NAFResidualUNet
  width: 32
  enc_blocks: [2, 2, 4, 8]
  middle_blocks: 12
  dec_blocks: [2, 2, 2, 2]
  delta_scale_hf: 0.15
  delta_scale_ll: 0.05
  output_channels: 13
training:
  epochs: 60
  physical_batch: 4
  grad_accum: 2
  effective_batch: 8
  optimizer: Adam
  lr: 2.0e-4
  betas: [0.5, 0.999]
  weight_decay: 0.0
  warmup_epochs: 5
  min_lr: 2.0e-6
  amp: true
  grad_clip_norm: 1.0
  ema_decay: 0.999
  seeds: [42, 1337, 2026]
loss:
  lambda_id: 1.0
  lambda_lm: 1.0
  lambda_parse: 0.5
  lambda_kl: 0.1
  lambda_low: 2.0
  lambda_con: 1.0
  triplet_margin: 0.2
  lambda_spec: 0.5
  lambda_dir: 0.5
  lambda_adv: 0.1
  lambda_type: 0.0
  lambda_idadv: 0.0
  lambda_budget: 0.5
  artifact_min: 0.01
  artifact_max: 0.25
  lambda_tv: 0.05
  tv_delta_scale: 0.25
  lambda_bg: 1.0
