  weight_bytes_from_source_cache: NONE

# ---------------------------------------------------------------- data firewall (spec §3.5)
data:
  split_manifest: manifests/split_v1.parquet
  split_manifest_sha256: fb9aeb369a124fc96ba855ef2ce269236c4a743fe960e73ab739412c9cb5092d
  canonical_face_root: "<runtime_root>/data/processed/faces_256"
  canonical_face_size: 256
  preprocess_contract: configs/frozen/preprocess_v1.yaml
  preprocess_contract_sha256: 265b75755ecede0d9c01f6d1e22f4d232767ec1e15faf8d7d55de11a68996e9e
  splits:
    TRAIN: {used_for: [method_training], allowed: true}
    VAL:
      used_for: [diagnostics_only]
      allowed: true
      may_select_checkpoint: false
      note: "VAL never selects a checkpoint; no VAL-based rule exists in this method's source."
    TEST:
      used_for: []
      allowed: false
      never_training: true
      never_checkpoint_selection: true
      never_hyperparameter_selection: true
      never_reconstruction_choice: true
      never_seed_selection: true
      code_path_present: false
  geometry_input: "68-point 2-D landmarks from the frozen M2 cache, normalised by image width"

# ---------------------------------------------------------------- experiment seeds
seeds:
  experiment_seeds: [42, 1337, 2026]
  runs_per_method: 3
  all_three_are_primary_evidence: true
  best_seed: FORBIDDEN
  preferred_seed: FORBIDDEN
  presentation_seed: FORBIDDEN
  seed_selection_using_test: FORBIDDEN
  primary_result_aggregation: MEAN_AND_STD_OVER_ALL_THREE_SEEDS
  per_seed_values_reported: true
  max_over_seeds_as_primary: FORBIDDEN
  dropping_a_poor_seed: FORBIDDEN
  rerunning_only_a_poor_seed: FORBIDDEN
  seed_scope: "seeds the main training run; checkpoint selection happens INSIDE each seed"

# ---------------------------------------------------------------- training (OFFICIAL)
training:
  input_resolution: 256
  map_size: 32
  batch_size: 2
  batch_size_note: "model/config.py:39 is the effective default; root config.py (BATCH_SIZE=5) is vestigial/unimported"
  g_d_ratio: 2
  max_epoch: 50
  steps_per_epoch: 2000
  val_steps: 500
  horizontal_flip: enabled
  flip_permutation: canonical_iBUG_68_lm_reverse_list
optimizer:
  name: tf.train.AdamOptimizer
  learning_rate: 6.0e-5
  lr_decay: {type: exponential, rate: 0.9, every_steps: 20000, staircase: true}
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-8
  weight_ema_decay: 0.9999
  loss_ema_decay: 0.9
losses:
  g_loss: "50*esr + gan + (10*reg_live + 1e-4*reg_spoof)"
  d_loss: "sum/4"
  a_loss: "5*esr_a + {0.0 or 0.1}*pixel"
  hard_sample_scaling: "U(0.1, 0.8) per component"
  multiscale_discriminators: [256, 160, 40]
supervision: binary_live_spoof_only
attack_type_labels: FORBIDDEN
workers_policy: IMPLEMENTATION_ADAPTABLE_NO_SCIENTIFIC_IMPACT
seed_adapter:
  status: RESOLVED_BY_SPEC_PRECEDENCE_BUT_IMPLEMENTATION_ADAPTER_REQUIRED
  note: "Source sets no seed; the frozen spec seed set takes precedence. Adapter implemented at M6C."
checkpoint:
  cadence: every_epoch_ckpt_1_to_ckpt_50
  rule: OFFICIAL_LATEST_FINAL_CKPT_50
  rule_source: SOURCE_RESOLVED
  baseline_final_state_v1_overrides_this: false
  overridden_note: "A2-06 clause 1 preserves an already-resolved official checkpoint rule."
  selection_scope: WITHIN_SEED
  selection_uses_val: false
  selection_uses_test: false
external_assets: []

# ---------------------------------------------------------------- checkpoint retention
checkpoint_retention:
  metric_history: RETAIN_COMPLETE
  checkpoint_bytes: RETAIN_PER_OFFICIAL_CADENCE
  never_delete: [authoritative_final_checkpoint, selected_checkpoint, officially_required_checkpoint]
  pruning_in_m6b: false
  if_pruned_later: metadata_and_sha256_records_must_remain

# ---------------------------------------------------------------- run layout
run_layout:
  root_template: "<runtime_root>/runs/m6/E03/seed_<seed>/"
  files:
    resolved_config: resolved_config.yaml
    run_manifest: run_manifest.json
    metrics: metrics.jsonl
    checkpoint_dir: checkpoints/
    checkpoint_index: checkpoint_index.json
    run_summary: run_summary.json
    stdout: stdout.log
    stderr: stderr.log
  outputs_in_git: false
  checkpoint_bytes_in_git: false

# ---------------------------------------------------------------- logging (learned method)
logging:
  contract: run_logging_v1
  full_trajectory_retained: true
  keep_only_final_epoch: FORBIDDEN
  metrics_format: metrics.jsonl
  metrics_append_only: true
  one_record_per: configured_reporting_interval
  resume_policy: APPEND_OR_EXPLICITLY_RECONCILE_NEVER_OVERWRITE
  per_record_required:
    - epoch
    - global_step
    - learning_rate
    - all_available_train_losses
    - all_available_train_metrics
    - all_available_val_losses
    - all_available_val_metrics
    - wall_clock_seconds
    - gpu_memory_bytes_where_practical
  missing_fields_must_be_explicit: true
  fabricating_unexposed_metrics: FORBIDDEN
  checkpoint_history_required: true
  run_summary_required: true

# ---------------------------------------------------------------- synthetic bank accounting
synthetic_bank_accounting:
  generated_in_m6b: false
  per_sample_record_required:
    - source_pair_or_sample_id
    - method_id
    - experiment_seed
    - generator_checkpoint_sha256
    - recipe_or_operator_metadata
    - synthetic_output_path
    - output_sha256
    - success_or_failure_reason
  merged_into_test: FORBIDDEN

field_provenance:
  SPEC: [supervision, data.splits, seeds.experiment_seeds]
  OFFICIAL_CODE: [training, optimizer, losses, checkpoint.cadence, checkpoint.rule]
  AMENDMENT_A2: [checkpoint.baseline_final_state_v1_overrides_this]
  M6B: [run_layout, logging, checkpoint_retention, synthetic_bank_accounting]
