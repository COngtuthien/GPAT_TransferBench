# E03 — STDN · M6B EXECUTION CONFIG — FROZEN 2026-09-21.
#
# Every execution-affecting value is frozen here BEFORE implementation and training. No value may
# depend on cwd, os.listdir ordering, hostname, shell environment, PYTHONHASHSEED, automatic
# checkpoint choice, TEST performance or a "best seed". Values already fixed by the frozen
# specification or by Amendments A1/A2/A3 are copied faithfully; NOTHING was retuned in M6B.
#
# Provenance of every field is tagged in `field_provenance`. M6B created no checkpoint, ran no
# model and touched no TEST data.
