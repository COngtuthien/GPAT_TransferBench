  scope: "netE_nir + netE_vis + netG"
  netCls_in_optimizer: false
  netCls_note: "official behaviour: the classifier head stays at initialisation while loss_cls backpropagates into the encoder"
losses:
  lambda_mmd: 50
  lambda_ip: 1000
  lambda_type: 10
  lambda_ort: 1
  lambda_pair: 5
  lambda_pair_source: "train_generator.sh:17 (passed via --lambda_pair at :29); argparse default 0.5 is not executed"
  retained: [loss_rec, loss_kl, loss_mmd, loss_ip, loss_pair, loss_cls, loss_ort]
  removed: []
  loss_cls_active: true
  loss_pair_active: true
  assembly: "unweighted sum: rec + kl + mmd + ip + pair + cls + ort"
  warmup: "epochs < 2 scale every term except loss_rec by 0.01"
  coefficients_retuned: false
