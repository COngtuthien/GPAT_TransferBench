# ---------------------------------------------------------------- A3 §5: controlled encoder reconstruction
conditioning_encoder:
  required_every_training_step: true
  removed: false
  disabled: false
  replaced_with_imagenet_or_torchvision_resnet18: false
  architecture: models/custom_rn.py::resnet18
  architecture_topology: "_resnet('resnet18', BasicBlock, [3,4,6,3]) — a ResNet-34 layer topology despite the name"
  architecture_substituted: false
  feature_interface_at_256:
    x32x32: {shape: [32, 32, 128], consumed: true}
    x16x16: {shape: [16, 16, 256], consumed: true}
    x8x8: {shape: [8, 8, 512], consumed: true}
    embg: {shape: [B, K], consumed: false, note: "DISCARDED by unet_autoenc; the class count changes ONLY this head"}
  checkpoint_format: "torch.save of the WHOLE nn.Module (matches torch.load(path).cuda())"
  substitute_objective:
    original: "17-way attack classification on PADISI-USC (ImageFolder)"
    unavailable: [released_PADISI_pkl_weights, PADISI_USC_dataset, seventeen_class_directory_mapping]
    substitute: K7_ATTACK_MACRO_CLASSIFICATION
    K: 7
    class_source: manifests/artifact_probe_classes_v1.json
    class_source_sha256: c7d23e3e3e6a526ae412a50125d0d56379ce98bca99d4133ead3fda7139a3812
    classes: [live, makeup, mask_2d, mask_3d, partial, print, replay]
    excluded: [other_spoof]
    split: TRAIN_ONLY
    train_counts: {live: 5629, print: 2838, replay: 2178, partial: 1911, mask_3d: 1056, makeup: 759, mask_2d: 96}
    train_total: 14467
    disclosed_interaction: >-
      This taxonomy is also the ArtifactProbeNet label space behind the ArtSim metric. Separate
      models, no shared weights, no TEST, so not leakage; but it could in principle favour E07c on
      ArtSim. Disclosed because it advantages the BASELINE, not GPAT.
  training_contract:
    head: "fc = nn.Linear(512, 7)"
    input_resolution: 256
    preprocessing: "Resize((256,256)) -> ToTensor -> Normalize([0.5]*3, [0.5]*3)"
    augmentation: NONE
    class_balancing: NONE
    class_balancing_note: "official code has none; adding it would be a benchmark invention"
    loss: CrossEntropyLoss_on_fourth_forward_output
    optimizer: SGD
    learning_rate: 0.002
    momentum: 0.9
    weight_decay: 5.0e-3
    scheduler: NONE
    batch_size: 256
    drop_last: true
    shuffle: true
    workers: 6
    epochs: 200
    checkpoint_rule: FINAL_STATE_AFTER_EPOCH_200
    checkpoint_rule_source: "OFFICIAL — torch.save overwrites in-loop, so the surviving file IS the final epoch's"
    benchmark_defined_additions: [K7_label_space, TRAIN_data_source, auxiliary_encoder_training_seed,
                                  auxiliary_encoder_training_runs]
  # ------------------------------------------------ A3 §5.4b auxiliary seed vs experiment seed
  auxiliary_encoder_training_seed: 42
  auxiliary_encoder_training_runs: 1
  trained_exactly_once: true
  three_different_encoders_trained: FORBIDDEN
  same_frozen_encoder_reused_for_main_seeds: [42, 1337, 2026]
  sha256_recorded_before_difffas_consumes_it: true
  seed_distinction:
    auxiliary_encoder_training_seed: "42, fixed; seeds the one-off pretraining of the substitute conditioning encoder"
    e07c_experiment_seed: "42 / 1337 / 2026; seeds each DiffFAS main training run"
  rationale: >-
    Most closely reproduces the role of the unavailable original PADISI.pkl, which would have been
    ONE fixed external pretrained asset shared across DiffFAS runs.
  run_layout: "<runtime_root>/runs/m6/E07c/aux_encoder/seed_42/"
  trained_in_m6b: false
  candidate_encoder_search: FORBIDDEN
  val_used_for_encoder_selection: false
  test_used_for_anything: false
