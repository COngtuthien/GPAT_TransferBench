# run_logging_v1 — M6 RUN LOGGING CONTRACT — FROZEN 2026-09-21 (M6B).
#
# The owner explicitly requires preservation of ALL experimental trajectories. This contract is
# binding for every M6 baseline run. Nothing here executes a model; M6B only freezes the contract.
#
# Governing rule: a method must NEVER fabricate a metric it does not naturally expose. Fields that
# do not apply must be written EXPLICITLY as null with a stated reason, never silently omitted.
version: run_logging_v1
status: FROZEN
frozen_utc: "2026-09-21"
milestone: M6B
applies_to: [E01, E02, E03, E04, E05, E06c, E07c]
spec_sha256: f7d2371682ad9504f59f0c6984e4b1a741f855f1b1f60838f9d60b160281489e

# ---------------------------------------------------------------- run identity (run_manifest.json)
run_identity:
  required_fields:
    - method_id
    - experiment_seed
    - run_id                       # deterministic: sha256("<method_id>|<seed>|<config_sha256>|<git_commit>")[:16]
    - run_uuid                     # uuid4, recorded for cross-reference
    - git_commit
    - git_dirty
    - config_path
    - config_sha256
    - source_commits               # map: {source_name: pinned_commit}
    - host
    - gpu_model
    - gpu_count
    - cuda_version
    - cudnn_version
    - pytorch_version              # or tensorflow_version for E03
    - python_version
    - dependency_fingerprint       # sha256 of the resolved environment lock
    - environment_lock_path
    - start_utc
    - end_utc
    - command_line
  run_id_formula: "sha256(UTF-8(method_id + '|' + str(seed) + '|' + config_sha256 + '|' + git_commit)) hex, first 16 chars"
  resolved_config_written: true
  resolved_config_file: resolved_config.yaml

# ---------------------------------------------------------------- per-epoch / per-iteration history
trajectory:
  file: metrics.jsonl
  format: JSON_LINES
  append_only: true
  one_record_per: configured_reporting_interval
  keep_only_final_epoch: FORBIDDEN
  full_history_must_survive_training: true
  resume_policy: APPEND_OR_EXPLICITLY_RECONCILE
  resume_overwrite: FORBIDDEN
  resume_reconciliation_record_required: true
  required_fields:
    - epoch
    - global_step
    - learning_rate
    - train_losses                 # object: every loss the method exposes, by name
    - train_metrics                # object: every train metric the method exposes
    - val_losses                   # object; null + reason if the method exposes none
    - val_metrics                  # object; null + reason if the method exposes none
    - wall_clock_seconds
    - gpu_memory_bytes             # null where not practical, with reason
  missing_field_policy: EXPLICIT_NULL_WITH_REASON
  fabricating_unexposed_metrics: FORBIDDEN
  val_role: DIAGNOSTIC_ONLY
  val_may_select_checkpoint: false
  test_appears_in_trajectory: FORBIDDEN

# ---------------------------------------------------------------- non-learned methods (E01, E02)
non_learned_methods:
  applies_to: [E01, E02]
  epoch_history: NOT_APPLICABLE
  inventing_epochs: FORBIDDEN
  file: generation_log.jsonl
  required_fields:
    - method_id
    - experiment_seed
    - config_sha256
    - pair_or_sample_id
    - deterministic_pair_seed
    - operator_or_block_selection_metadata
    - generation_status
    - failure_reason               # null on success
    - output_path
    - output_sha256
  run_level_required:
    - wall_clock_seconds
    - output_manifest_path
    - run_summary
  e01_specific_required: [selected_operator_name, magnitude_level, sampled_operator_parameters,
                          selected_asset_filename, asset_enumeration_rule]
  e02_specific_required: [n_eligible, k_selected, selected_block_indices_sorted_ascending,
                          numpy_version, pcg64_seed_integer]

# ---------------------------------------------------------------- checkpoint history
checkpoint_history:
  file: checkpoint_index.json
  record_every_checkpoint_actually_written: true
  required_fields:
    - path
    - epoch
    - global_step
    - file_size_bytes
    - sha256
    - checkpoint_type              # periodic | official | terminal | selected
    - selected_for_final           # true | false
    - selection_reason             # exact frozen rule that made it selected, or why not
  checkpoint_type_enum: [periodic, official, terminal, selected]
  selection_reason_must_cite_frozen_rule: true
  selection_uses_test: FORBIDDEN

# ---------------------------------------------------------------- final run summary
run_summary:
  file: run_summary.json
  required_fields:
    - method_id
    - experiment_seed
    - run_id
    - final_or_selected_checkpoint_path
    - final_or_selected_checkpoint_sha256
    - checkpoint_selection_rule
    - seed_level_evaluation_metrics
    - training_duration_seconds
    - peak_vram_bytes              # null where unavailable, with reason
    - completion_status            # completed | failed | interrupted | resumed_completed
    - failure_reason               # null unless failed/interrupted

# ---------------------------------------------------------------- retention
retention:
  metric_history: RETAIN_COMPLETE
  checkpoint_bytes: RETAIN_PER_METHOD_OFFICIAL_CADENCE_OR_FROZEN_RULE
  never_delete:
    - authoritative_final_checkpoint
    - selected_checkpoint
    - officially_required_checkpoint
  intermediate_periodic_checkpoints: follow_source_or_frozen_cadence
  pruning_performed_in_m6b: false
  if_pruned_later: "metadata and SHA256 records MUST remain in checkpoint_index.json"
  silent_pruning: FORBIDDEN

# ---------------------------------------------------------------- output layout
output_layout:
  run_root_template: "<runtime_root>/runs/m6/<method_id>/seed_<seed>/"
  auxiliary_encoder_root: "<runtime_root>/runs/m6/E07c/aux_encoder/seed_42/"
  files: [resolved_config.yaml, run_manifest.json, metrics.jsonl, checkpoints/,
          checkpoint_index.json, run_summary.json, stdout.log, stderr.log]
  training_outputs_in_git: FORBIDDEN
  checkpoint_bytes_in_git: FORBIDDEN
  repository_keeps: "compact provenance/audit summaries only"

# ---------------------------------------------------------------- result aggregation
result_aggregation:
  experiment_seeds: [42, 1337, 2026]
  each_seed_yields: one authoritative final result per that method's frozen checkpoint rule
  primary_result: MEAN_AND_STD_OVER_ALL_THREE_SEEDS
  per_seed_values_reported: true
  max_over_seeds_as_primary: FORBIDDEN
  best_seed_as_primary: FORBIDDEN
  dropping_a_poor_seed: FORBIDDEN
  rerunning_only_a_poor_seed_until_it_improves: FORBIDDEN
  seed_selection_using_test: FORBIDDEN
  best_seed_permitted_use: >-
    ONLY for an explicitly-labelled qualitative visualisation that requires a single example. It
    must never replace or influence the three-seed primary quantitative result.
  checkpoint_selection_vs_seed_selection: >-
    Checkpoint selection happens WITHIN each seed, per that method's already-frozen rule. All three
    seed-level results then remain in the final aggregation. These are different operations and must
    never be conflated.

# ---------------------------------------------------------------- data firewall
data_firewall:
  TRAIN: method training / fitting where allowed
  VAL: diagnostics and only frozen selection behaviour
  TEST:
    never_training: true
    never_checkpoint_selection: true
    never_hyperparameter_selection: true
    never_reconstruction_choice: true
    never_seed_selection: true
  test_code_path_in_m6: ABSENT
