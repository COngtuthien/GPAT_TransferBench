# fair_track_v1 — FROZEN 2026-09-20 under Owner Protocol Amendment A1.
#
# Defines the PRIMARY (Track A) and SECONDARY (Track B) comparison contracts. The original frozen
# specification is NOT edited and remains historically authoritative; this file and the amendment
# change the primary comparison contract from this point forward.
#
# Amendment: docs/spec/amendments/GPAT_TransferBench_v1_0_Amendment_A1_Fair_IDFree_Main_Track.md
# Deviations: DEV-019 (this file), DEV-020 (DSDG), DEV-021 (DiffFAS)
version: fair_track_v1
status: FROZEN
frozen_utc: "2026-09-20"
amendment: A1
amendment_path: docs/spec/amendments/GPAT_TransferBench_v1_0_Amendment_A1_Fair_IDFree_Main_Track.md
amendment_sha256: 03828716def5e535d82445974972bf71a5c8ecc60392fac4b884bcbe060e3472
deviation: DEV-019
classification: MAIN_FAIR_TRACK_IDENTITY_FREE_PROTOCOL_AMENDMENT
original_spec_sha256: f7d2371682ad9504f59f0c6984e4b1a741f855f1b1f60838f9d60b160281489e
original_spec_modified: false
decision_timing: >-
  Adopted before M5 probe training, M6 baseline training, M7 GPAT training, any synthetic
  generation and any inspection of any result. Justified by protocol fairness and data
  availability, never by observed performance. No model has been trained in this project.

references:
  split_manifest: manifests/split_v1.parquet
  split_manifest_sha256: fb9aeb369a124fc96ba855ef2ce269236c4a743fe960e73ab739412c9cb5092d
  common_pairs_train: manifests/pairs_train_v1.parquet
