  "pinned_execution_details": {
    "D1": "an epoch is floor(N_live / 32) full batches over a fresh permutation of the TRAIN live frames (tail dropped). Real-spoof and synthetic pools are consumed sequentially from their own permutations without replacement; when fewer items remain than a batch needs, the remainder is discarded and the next permutation is drawn (never duplicates inside a batch). Batch tensor order: live, real spoof, synthetic. E00 uses 32 live + 32 real spoof",
    "D2": "VAL/TEST/holdout: torchvision.transforms.functional.resize on the PIL 256x256 RGB image to [224, 224], InterpolationMode.BICUBIC (PIL path), then to_tensor and Normalize(mean [0.485, 0.456, 0.406], std [0.229, 0.224, 0.225])",
    "D3": "BCEWithLogitsLoss target = label_binary (1 spoof, 0 live; synthetic = 1); p_frame = sigmoid(logit) = P(spoof)",
    "D4": "predicted spoof iff score >= threshold, for frames and videos, VAL and holdout/TEST",
    "D5": "VAL video metrics after every epoch; epoch ACER at that epoch's own section-15 threshold; select the minimum ACER, then maximum VAL video AUC, then the earliest epoch; the selected epoch's threshold is the frozen threshold",
    "D6": "S = steps per epoch, W = warmup_epochs*S, T = epochs*S; optimizer step k = 0..T-1; for k < W: lr_g(k) = base_g * k / W (first step lr 0, disclosed); for k >= W: lr_g(k) = 1e-6 + (base_g - 1e-6) * 0.5 * (1 + cos(pi * (k - W) / (T - W))). Groups: head = fc.weight, fc.bias (base 5e-4); backbone = all other parameters (base 1e-4); weight decay 1e-4 on all parameters; AdamW betas (0.9, 0.999), eps 1e-8 (torch defaults); clip_grad_norm_ over all parameters to 1.0 before each step; LR set before each step",
    "D7": "EER over section-15 candidates: if APCER = BPCER at a candidate, that value; otherwise linear interpolation of APCER and BPCER between the adjacent candidates where APCER - BPCER changes sign, value at the crossing (implemented: gpatbench/downstream/metrics.eer_linear_interpolation)",
    "D8": "spoof is positive: TPR = 1 - APCER, FPR = BPCER; F1 = spoof-class F1 (implemented: metrics.f1_spoof); TPR@FPR=x = max over section-15 candidates of (1 - APCER) subject to BPCER <= x, no interpolation (proposed pin, requires confirmation)",
    "D9": "frame-level diagnostics use the frozen video threshold (implemented: metrics.frame_level_rates)",
    "D11": "the smoke evaluator stage is ResNet-18 only; DINOv3 needs its frozen config (spec 23), pinned revision and weights, license and environment before M11",
    "D12": "detector seed s uses the bank of generator seed s; synthetic pool = all valid outputs of that bank (RAW-MATCHED), generation failures excluded and counted; for E01/E02 QUALITY-MATCHED equals RAW-MATCHED unless the M8 N_common rule forces deterministic subsampling",
    "D13": "smoke: CPU, AMP off, torch.use_deterministic_algorithms(True), torch.set_num_threads(8), torch.set_num_interop_threads(1), DataLoader num_workers 0. Science: CUDA with AMP; the AMP dtype and GradScaler policy must be pinned before M10 (not needed for the smoke)",
    "D14": "train transform: RandomResizedCrop(224, scale (0.92, 1.00), ratio (0.95, 1.05), BICUBIC) -> RandomHorizontalFlip(0.5) -> RandomApply([ColorJitter(0.05, 0.05, 0.05, 0.01)], p 0.5) -> to_tensor -> Normalize (ImageNet); all random parameters drawn from the dedicated augmentation generator in sample order",
    "rng_scheme": {
      "model": "torch.manual_seed(seed) immediately before building the model (initializes the new fc head; the backbone comes from the hash-verified weights)",
      "sampler": "per pool p in {live, real_spoof, synthetic} and pass index i: numpy Generator(PCG64(int.from_bytes(SHA256(UTF-8('gpatbench.downstream.sampler.v1|resnet18|'+method_id+'|'+str(seed)+'|'+p+'|'+str(i))), 'big'))).permutation(n)",
      "augmentation": "torch.Generator().manual_seed(int.from_bytes(SHA256(UTF-8('gpatbench.downstream.augment.v1|resnet18|'+method_id+'|'+str(seed))), 'big') % 2**63)"
    },
    "inputs": "real frames read from <runtime_root>/data/processed/faces_256 with bytes verified against the M2 face_png_sha256 before decoding (as methods/common/bank_writer.py); synthetic images read through gpatbench/downstream/bank_reader.read_verified_bank"
  },
