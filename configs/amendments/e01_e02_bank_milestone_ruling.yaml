  "smoke_test_record_note": "null on purpose. Under Q1 option A, tools/e01_e02_bank.py refuses production until a committed, hash-verified deterministic smoke-test record with smoke_test_passed true is bound here. That binding is M8 work and needs its own owner authorization; this ruling does not supply, waive or shortcut it.",
  "owner_ruling": {
    "Q1_milestone_owner": {
      "decision": "A_M8_SMOKE_GATED",
      "text": "M8 owns real production synthetic-bank generation. M6 owns method implementation, frozen-contract verification, production writer qualification and readiness evidence. M8 owns production synthetic-bank generation, final bank manifests and bank completion audits. The deterministic smoke-test gate required by the existing authority (M6D6jR O3) remains mandatory before production banks. E01 and E02 require no generator training. The correct M6 closure for both methods is writer-qualified, not bank-completed.",
      "scope": "milestone ownership of the E01/E02 per-seed banks (8838 outputs x seeds 42/1337/2026); no change to the frozen milestone specification (spec section 25) or to M6D6jR O3",
      "prohibitions": ["no real TRAIN bank is generated in M6", "this ruling is not approval to bypass the M8 smoke-test gate", "the frozen milestone specification is not altered"]
    },
    "Q2_e01_round_robin_ordinal": {
      "decision": "MANIFEST_POSITION_ZERO_BASED",
      "text": "For the canonical TRAIN pair relation sorted by pair_id ascending, use zero-based positional indexing: the first pair PTR000001 has position 0, and the official operator is operator_set[position % 8]. PTR000001 maps to operator 0 (Color_Diversity), PTR000002 to operator 1 (Color_Distortion), cyclically across the full frozen population. The operator index is not derived from the numeric suffix of pair_id and the operator sequence is not rotated by experiment seed.",
      "pinned_operator_order": ["Color_Diversity", "Color_Distortion", "Reflection", "BN_Halftone", "Moire_Pattern", "SFC_Halftone", "Hand_Trembling", "Low_Resolution"],
      "pinned_operator_order_source": "official RizhaoCai/FAS-Aug@0da1dd79bad00e225b8cb6977c7f3f06ee8f7517 data/FAS_Augmentations.py augment list entries #0..#7; equal to configs/methods/e01_fas_aug.yaml generation.operator_set; OfficialFASAugBackend.prepare() refuses any mismatch",
      "population_effect": "8838 = 8 x 1104 + 6: operators 0-5 receive 1105 pairs and operators 6-7 receive 1104 pairs per seed",
      "preserved": ["approved per-pair seed derivation operator_seed = int.from_bytes(SHA256(UTF-8(pair_id + str(seed))), 'big') mod 2^31 (A2-05; PTR000001/42 -> 795981663)", "all eight official FAS-Aug operators and their magnitude ranges", "NUM_MAG 10 magnitude grid", "level 0 retained; some outputs may be unchanged copies of the live image and are disclosed"],
      "implementation_status_at_ruling": "the writer (methods/common/bank_writer.py at 01de91a) already passes index = position for MANIFEST_POSITION_ZERO_BASED, and the 028b5c1 synthetic qualification used that rule (gate G5: operator = position mod 8); the approved rule is therefore not a mapping change relative to the qualified writer"
    },
    "Q3_e02_uint8_quantization": {
      "decision": "CONFIRM_CLIP_THEN_RINT",
      "text": "Keep the existing M6C1/M6D1 implementation-defined rule: frozen frequency-substitution computation, target phase preserved, inverse FFT, real component, clip to [0,255], numpy.rint (round to nearest, ties to even), convert to uint8.",
      "disclosure": "the final rounding convention is an implementation-defined choice already qualified in M6D1, not an explicit instruction of spec section 8.2",
      "unchanged": ["frequency-band selection (0.20 <= r <= 0.50, >= 75 % block coverage)", "16x16 block size", "eligible block population n_eligible = 159 and k = 40", "source/target semantics (source spoof magnitude, target live phase)", "pixel-wise conjugate closure", "inverse transform", "numerical tolerance 1e-8 on the inverse-FFT imaginary residual"],
      "retained_evidence": "E02 numerical regression fixtures and the cross-environment pixel identity observed at 028b5c1"
    },
    "Q4_execution_host": {
      "decision": "SEPARATE_CLONE_CPU_CONCURRENT",
      "text": "Future E01/E02 production banks run on CPU in the locked gpat-m5 environment on the GPU host, from an isolated clean checkout or clone pinned to the approved production authority, never from the GPU checkout used by E04 scientific training. E04's environment and runtime are not modified. No package is installed or upgraded.",
      "interpretation_of_concurrent": "the isolated CPU-only run need not wait for an E04 run to end; it never touches the E04 checkout, environment, runtime root, tmux session or GPU (CUDA_VISIBLE_DEVICES empty). This does not authorize running before the M8 gate.",
      "disclosures": ["E01: cross-environment numerical variation was observed in the Hand_Trembling operator (3/72 synthetic outputs differ by <= 1 LSB between the laptop .venv and gpat-m5); laptop and GPU-host E01 outputs are not claimed byte-identical", "E02: the observed cross-environment pixel identity is evidence for those two stacks only, not an unrestricted guarantee"],
      "machine_checked": "operational; tools/e01_e02_bank.py enforces the locked gpat-m5 interpreter (verify_locked_environment) and a clean worktree"
    }
  },
