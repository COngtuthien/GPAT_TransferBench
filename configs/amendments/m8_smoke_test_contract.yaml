    "S2": "class = label_binary (0 live, 1 spoof) within each of casia_fasd, msu_mfsd, siwmv2; a selected unit contributes only the frames of the class it was selected for",
    "S3": "siwmv2 unit = content_group_id (DEV-012 video-content allocation unit). DISCLOSURE: a SiW-Mv2 content group is NOT a subject identity; every smoke record and table calls it 'content group'. casia_fasd/msu_mfsd unit = subject_id_global (must be non-null)",
    "S4": "within (dataset, split, label_binary) units ascend by SHA256(UTF-8('gpatbench.smoke.v1|'+dataset+'|'+split+'|'+str(label_binary)+'|'+unit_id)) hex. TRAIN: first 2 eligible per class; a live unit is eligible only if it is the target of >= 1 frozen pairs_train_v1 pair (skips recorded). VAL select: first 2 per class. Any shortfall is a blocker; no fallback or substitution",
    "S5": "VAL holdout (simulated TEST stage) = first 2 units per class in the same order excluding every unit in VAL select of either class, so select and holdout share no unit. VAL select is used only for checkpoint and threshold selection; VAL holdout is scored exactly once with the frozen threshold. TEST rows, files and metadata are never read: split rows are read through a TRAIN/VAL parquet row filter (gpatbench/downstream/firewall.read_permitted_rows)",
    "S6": "toy pairs = frozen pairs_train_v1 rows whose target unit is a TRAIN live toy unit, with canonical 0-based global positions (E01 operator = position % 8); sources may lie outside the toy units and are TRAIN by construction. Feasibility record: 186 pairs (casia 141, msu 27, siwmv2 18), all 8 E01 operators covered",
    "S7": "the initial global smoke uses the implemented E01 and E02 bank writers only. Each learned method (E03-E06c) must pass its own bank-stage acceptance before its full production bank. GPAT is not authorized",
    "S8": "CPU smoke schedule below (SMOKE_NON_SCIENTIFIC); banks in gpat-m5 (Q4), evaluator/metrics/plots in gpat-m8-downstream; isolated clean clone on the GPU host at the smoke authority commit; nice 19, ionice idle, CUDA_VISIBLE_DEVICES empty; never the E04 checkout",
    "S9": "BITWISE_ALL_STAGES applies only if environment check V4 (two-process CPU training determinism) passes. Then the full smoke runs twice in fresh roots and every bank file, bank manifest, prediction file, metrics table and plot input table must be byte-identical (PNG bytes too if V5 passed). If V4 or the replay fails: STOP and report the reproducibility limitation; the criterion is not weakened without a new owner decision",
    "S10": "banks: E01 and E02 for seeds 42, 1337, 2026 over the 186 toy pairs; evaluator: detector seed 42 only (E00 real-only, E01 with bank seed 42, E02 with bank seed 42)"
  },
