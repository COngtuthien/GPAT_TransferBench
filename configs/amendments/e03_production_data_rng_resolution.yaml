    even_step: {fetch: 'losses + [g_op, d_op, fig]', sess_runs: 1, g: 1, d: 1, global_step_delta: 2}
    odd_step: {fetch: 'losses + [g_op, fig]', sess_runs: 1, g: 1, d: 0, global_step_delta: 1}
    sequential_g_then_d_rewrite: FORBIDDEN
    per_epoch: {train_steps: 2000, g: 2000, d: 1000, global_step_delta: 3000}
    total: {train_steps: 100000, g: 100000, d: 50000, final_global_step: 150000}
  learning_rate: {initial: 6.0e-5, rate: 0.9, decay_steps_shared_global: 20000, staircase: true,
                  boundaries_global_step: [20000, 40000, 60000, 80000, 100000, 120000, 140000],
                  epochs_per_decay_interval_approx: 6.67}
  epoch_order: [train_2000_steps, 'saver.save(global_step=epoch+1)', val_500_steps]
  final_checkpoint: {name: ckpt-50, rule: OFFICIAL_LATEST_FINAL_CKPT_50, written_before_epoch_50_val: true,
                     completed_after_epoch_50_val: true, val_changes_selection: false}
  feed:
    unit: one frozen pair row
    pipeline: [from_tensor_slices, 'shuffle(full population, split seed, reshuffle_each_iteration=True)', 'repeat(-1)',
               'map(num_parallel_calls=1)', 'batch(2)', 'prefetch(1)']
    shuffle_buffer: {TRAIN: 8838, VAL: 1905}
    tf_1_15_defaults_verified: {reshuffle_each_iteration_none_means: true, batch_drop_remainder_default: false}
    iterators_persist_across_epochs: true
    random_frame_selection: none
    resize: none (canonical faces are 256)
