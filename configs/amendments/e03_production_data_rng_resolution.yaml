            brightness: 'tf.image.random_brightness(max_delta=0.25) on live and spoof'}
    VAL: {flip: 'independent live/spoof, VAL NumPy draw > 0.5', brightness: none}
  landmarks: {field: landmarks_px256, shape: [68, 2], dtype: float32, finite: true, normalization: '/256',
              adapter: methods/stdn/landmarks.py}
  resume: NOT_QUALIFIED_FRESH_ONLY

implementation_bindings:
