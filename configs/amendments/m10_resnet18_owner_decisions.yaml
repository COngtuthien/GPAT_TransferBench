 "O1_precision_policy": {
  "policy_id": "CUDA_AMP_FP16_GRADSCALER_DETERMINISTIC",
  "pin_record": "configs/amendments/m10_resnet18_science_precision.yaml",
  "device": "cuda",
  "autocast": "torch.autocast(device_type='cuda', dtype=torch.float16) around the model forward (train and VAL)",
  "loss": "binary_cross_entropy_with_logits on float32 logits (logits.float())",
  "grad_scaler": {"constructor": "torch.amp.GradScaler('cuda')", "init_scale": 65536.0, "growth_factor": 2.0,
                  "backoff_factor": 0.5, "growth_interval": 2000, "enabled": true},
  "step_order": ["scaler.scale(loss).backward()", "scaler.unscale_(optimizer)",
                 "torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)", "scaler.step(optimizer)",
                 "scaler.update()"],
  "determinism": {"torch.use_deterministic_algorithms": true, "torch.backends.cudnn.deterministic": true,
                  "torch.backends.cudnn.benchmark": false, "torch.backends.cuda.matmul.allow_tf32": false,
                  "torch.backends.cudnn.allow_tf32": false, "CUBLAS_WORKSPACE_CONFIG": ":4096:8"},
  "forbidden": ["silent BF16 or FP32 substitution", "disabling deterministic algorithms to bypass a CUDA failure",
                "changing any scientific training parameter because GradScaler skips an optimizer step"],
  "skipped_steps": "owner: record GradScaler skipped-step behavior and stop if it violates the frozen effective-step or schedule requirements",
  "skipped_step_implementation": {
   "status": "AGENT_IMPLEMENTATION_OF_THE_APPROVED_RULE (disclosed; not an additional owner decision)",
   "schedule": "the D6 index k advances once per iteration (T = epochs * steps_per_epoch iterations, LR set before every iteration) whether or not GradScaler applies the update; a skipped update changes no LR value, batch, epoch length or iteration count",
   "recorded_per_iteration": ["grad_scale_before", "grad_scale_after", "optimizer_step_applied", "pre-clip unscaled gradient norm", "post-clip gradient norm"],
   "fail_closed": ["non-finite loss", "a non-finite unscaled gradient while the grad scale is <= 1 (a genuine non-finite gradient, not a scaling overflow)", "an epoch in which no optimizer update was applied"]
  }
 },
 "O2_threshold_rule": {
  "classification": "SCIENTIFIC_PROTOCOL_COMPLETION (owner ruling that completes spec 15 for exact ties; not a code bug fix)",
  "candidates": "all unique VAL video-score midpoints plus 0 and 1 (unchanged)",
  "decision": "spoof iff score >= threshold (D4, unchanged)",
  "hierarchy": ["1. minimize VAL video-level ACER over the candidates (exact rationals)",
                "2. among minimum-ACER thresholds, minimize |threshold - 0.5| (exact float comparison)",
                "3. if several thresholds remain tied, select the numerically smallest threshold (A_SMALLER_THRESHOLD, additive final tie-break)"],
  "epoch_eligibility": "every epoch with a valid VAL evaluation stays eligible; C_EPOCH_INELIGIBLE is not implemented",
  "checkpoint_selection": "D5 unchanged: minimum VAL video ACER, then maximum VAL video AUC, then earliest epoch",
  "test_used": false
 },
