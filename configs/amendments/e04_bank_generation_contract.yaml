   "option": "A_PAPER_SPOOF_SYNTHESIS",
   "rule": "out = (1-P_w)*(I_live + B~_w + C~_w + T_w) + P_w*I_source_w; B~ = low32(B) (network.lowpass 32), C~ = low128(C), P = sigmoid(raw[...,9]); B, C, T, P from the source spoof; _w = trace_transfer.warp (bilinear, border clamp, /cpu:0) with offsets = dense_offsets(source_xy = spoof Q140, target_xy = live Q140); operand order of training_graph.py:32-39 (w_B + w_C + w_T, then trace_transfer.synthesis); no random draw"
  },
  "E04-Q3": {
   "option": "A_PREDECESSOR_CLIP_TRUNCATE",
   "rule": "out_u8 = (np.clip(out, 0.0, 1.0) * 255.0).astype(np.uint8) on the float32 output; a row with any NaN/Inf is a counted RAW-MATCHED failure before conversion (never zero-filled, cast or substituted)",
