  "E04-Q1": {
   "option": "A_MOVING_STATISTICS_PER_PAIR",
   "rule": "network.generator topology with tf.layers.batch_normalization(training=False) (momentum .99, epsilon 1e-5, center/scale, fused) reading the restored moving_mean / moving_variance; one source spoof per forward (batch 1); no UPDATE_OPS, no batch statistics, no artificial 8-image batch"
