 "scientific_disclosures": [
  "CONTROLLED_ADAPTATION (A3): reporting label Physics-STD (controlled geometry/depth reconstruction).",
  "E04-Q1: the original E04 training synthesis used batch statistics over 8-image training batches (4 target lives + 4 source spoofs). Bank inference instead uses the checkpoint's stored moving statistics, accumulated (momentum 0.99) from both the original and the harder training batches. Bank inference is therefore a controlled adaptation and does not reproduce the training-time batch-statistics computation exactly. It is not official Physics-STD test-time behaviour (no official PhySTD code exists); the moving-statistics convention follows the official predecessor ECCV20-STDN test.py only as a reference where PhySTD is silent.",
  "E04-Q3: the clip-then-truncate conversion is the ECCV20-STDN predecessor writer, used only where PhySTD is silent; truncation biases each channel by about -0.5 grey level relative to rounding.",
  "E04-Q5: GPU bitwise replay is a requirement to be tested in S7, not a property established here; CPU fixture qualification does not prove GPU bitwise equivalence."
