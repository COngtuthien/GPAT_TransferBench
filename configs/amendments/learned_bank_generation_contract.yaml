  "owner_ruling": {
    "E03": {
      "decisions": ["E03-Q1 A_OFFICIAL_TEST_MODE", "E03-Q2 A_RAW_VARIABLES", "E03-Q3 A_NONE", "E03-Q5 A_NONE"],
      "text": "Use the official inference entrypoint behaviour: Gen(x, training_nn=False) with the moving batch-normalization statistics of ckpt-50 (test.py:55), raw trainable checkpoint variables restored with tf.train.Saver (test.py:58), never the weight-EMA shadow variables (model.py:122). No training brightness augmentation and no random horizontal flip. Inputs are canonical RGB256 faces / 255 (dataset.py:144) and the existing frozen e03_feed_pack_v1 landmarks_px256 / 256, unflipped. The bank holds only the resulting synthetic spoof image; no trace sidecar.",
      "frozen_graph": "Gen is applied to the source spoof image at batch 1 (test.py:49); then, verbatim, recon1 = (1-s)*img - b - tf.image.resize_images(C, [imsize, imsize]) - T (train.py:47), trace = img - recon1 (train.py:48), trace_warp = warping(trace, reg, imsize) (train.py:49, the spoof half of the training batch), synth1 = img_live + trace_warp (train.py:50), with reg = generate_offset_map(lm_sp, lm_li) (dataset.py:142). The generator graph, the spoof-trace synthesis equation, STDN training and the checkpoints are unchanged."
    },
    "E05": {
      "decisions": ["E05-Q1 A_PER_PAIR_SEEDED"],
      "text": "Immediately before the single official mix forward of each frozen pair, establish its deterministic generator noise state with torch.manual_seed(pair_seed); then mix = G(E(x_src).spatial, E(x_tgt).global) with x_src = source_spoof (spatial pattern) and x_tgt = target_live (global content). No zero-noise substitution, no new stochastic augmentation, no change to the architecture, checkpoint (iteration_4000.pth) or the approved input mapping (x/255 - 0.5)/0.5 without resize, crop or flip.",
      "pair_seed": "pair_seed = int.from_bytes(sha256(b'GPAT_TRANSFERBENCH|E05|BANK|' + str(seed) + '|' + pair_id).digest()[:8], 'big') mod (2^31 - 1)"
    },
    "DSDG": {
      "decisions": ["DSDG-Q1 A_OFFICIAL_BATCHES_SEEDED", "DSDG-Q2 A_SPOOF_ONLY", "DSDG-Q4 A_SYNTHETIC_ID"],
      "applies_to": ["E06b", "E06c"],
      "text": "Independently for E06b and E06c: g = torch.Generator().manual_seed(bank_seed); per batch of the official size 100: noise = randn(100, 128, generator=g) (identity noise first), noise_s = randn(100, 128, generator=g) (spoof noise second), z = cat(noise_s, noise, noise) (the frozen latent layout of generated.py:49); fake = netG(z) with the official Decoder_s and the frozen epoch-200 checkpoint; ceil(N/100) batches; keep the first N samples in stream order and record the discarded final-batch samples in provenance. Only the spoof RGB half (channels 0:3, generated.py:54) is retained; the live half is not stored. Row identity synthetic_id = '<method>_S<seed>_<index:06d>' with a zero-based stream index; pair_id, target_live_id and source_spoof_id are null; a pairs_train_v1 identifier is never assigned to a DSDG output. E06b and E06c keep distinct method identities, checkpoints and bank-seed domains.",
      "bank_seed": "bank_seed = int.from_bytes(sha256(b'GPAT_TRANSFERBENCH|' + method + b'|BANK|' + str(seed)).digest()[:8], 'big') mod (2^31 - 1), method in {'E06b', 'E06c'}"
    },
    "E06b": {
      "decisions": ["E06b-Q0 A_POOLED_8838"],
      "text": "The primary comparison bank of E06b has N_syn = 8838, the pooled synthetic budget of every other method (spec 7 / 8.6). The Track B coverage distinction (E06b was trained on the CASIA+MSU TRAIN spoof coverage, 3720 rows; SiW-Mv2 NOT_INSTANTIABLE_MISSING_SUBJECT_ID) is preserved and must be disclosed in the method report. E06b's training coverage, frozen training dataset and scientific identity are not redefined."
    },
    "common_output": {
      "decisions": ["Q4 A_SOURCE_IMAGE_WRITER", "C-Q1 A_PNG_LOSSLESS"],
      "text": "Each method's float output becomes uint8 exactly by its pinned source's own writer, with its clipping, scaling and truncation; E02's numpy.rint rule is not substituted. The resulting canonical 256x256x3 uint8 RGB pixels are stored as lossless PNG with the E01/E02 bank writer settings (PIL, compress_level 6, optimize False, no metadata chunks). The PNG container may differ from the source's file container; the approved pre-encoding uint8 pixels are unchanged. Pixel-level and file-level SHA256 are recorded for every row. No JPEG is a production bank artifact.",
      "conversions": {
        "E03": "fig = tf.clip_by_value(synth1, 0.0, 1.0) (model/utils.py:24); img = tf.cast(fig * 255, tf.uint8) (model/utils.py:37), in-graph in float32",
        "E05": "util.tensor2im(mix[0]) of the pinned basis: (np.transpose(x, (1, 2, 0)) + 1) / 2.0 * 255.0 (util.py:125), np.clip(x, 0, 255) (util.py:128), .astype(np.uint8) (util.py:131)",
        "E06b": "np.transpose((255 * spoof[i]).astype('uint8'), (1, 2, 0)) on the sigmoid output, no clip (generated.py:63)",
        "E06c": "as E06b"
      },
      "non_material_notes": [
        "E03 utils.plotResults also applies tf.image.resize_images(fig, [256, 256]), which TF1 skips when the static size is already 256x256, and an RGB->BGR channel swap that only compensates cv2.imwrite channel order; neither changes the stored RGB values, so the approved rule is clip then cast.",
        "NaN/Inf raw outputs are never cast: such a row is a counted failure (spec 7 RAW-MATCHED / 27), never substituted or duplicated."
      ]
    },
    "device_and_reproducibility": {
      "decisions": ["C-Q2 A_GPU_FP32_BITWISE_REPLAY"],
      "text": "S7 toy inference and production inference run on the approved RTX 3090 in each method's locked environment (E03 gpat-m6-e03; E05 gpat-m6-e05; E06b/E06c gpat-m6-e06c) in FP32 with the deterministic settings below. Acceptance requires a bitwise-identical replay. If TF1 or PyTorch GPU execution cannot satisfy bitwise replay: preserve all failure evidence and stop for owner review; do not weaken the requirement, and do not change architectures, checkpoints, graph operations or model output values to force determinism.",
      "settings": {
        "E03": "the qualified M6D2b E03 precision environment (environments/e03_stdn.lock.json precision_env: TF_DETERMINISTIC_OPS=1, TF_CUDNN_DETERMINISTIC=1, NVIDIA_TF32_OVERRIDE=0, TF_ENABLE_*_TENSOR_OP_MATH_FP32=0, auto mixed precision off, XLA off, CUBLAS_WORKSPACE_CONFIG=:4096:8) and methods.stdn.production_runner.session_config (allow_growth, meta-optimizer off, single intra/inter-op thread)",
        "E05": "methods.pcgan.production_runner.configure_precision flags (FP32 default dtype, matmul and cuDNN TF32 off, cudnn.benchmark False, cudnn.deterministic True, matmul precision highest, no autocast; NVIDIA_TF32_OVERRIDE=0, CUBLAS_WORKSPACE_CONFIG=:4096:8), as qualified for E05 training",
        "E06b_E06c": "the same PyTorch flags; the official generated.py cudnn.benchmark = True is overridden to False as a determinism control only"
      },
      "disclosure": "All listed settings select deterministic kernels or disable reduced-precision math; none changes an architecture, checkpoint, graph operation or the mathematical definition of an output. Any further determinism configuration must be disclosed to the owner before activation."
    },
