      "gates": ["exact checkpoint SHA256 (before and after)", "frozen config identity", "correct inference graph", "correct input population", "256x256x3 uint8 outputs", "zero unexpected failures", "finite raw tensors", "deterministic manifest and file hashes", "bank-reader verification", "bitwise replay between the two runs", "no checkpoint mutation", "no optimizer construction or step and no gradient", "TRAIN-only inputs", "O_NOATIME for every real face read", "zero VAL and TEST access", "toy outputs later equal the corresponding production rows byte for byte (checked by each production audit)"],
      "not_substitutable": "synthetic-fixture qualification never substitutes for this real toy acceptance"
    },
