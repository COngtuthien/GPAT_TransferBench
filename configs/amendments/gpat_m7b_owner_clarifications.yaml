    "R-02": {
      "topic": "resampling of the 128x128 mask M inside the section 9.4 artifact map",
      "required_by": "M7B",
      "status": "RESOLVED_M7B",
      "class": "IMPLEMENTATION_CLARIFICATION",
      "blocks_m7b": false,
      "blocks_m7c": false,
      "decision": {
        "wavelet_domain": "M used directly at 128x128; no resize",
        "artifact_map": "M_256 = bilinear_interpolate(M, size=(256, 256), align_corners=False)",
        "soft_mask": true,
        "threshold": "none",
        "A_rgb": "mean_channel(abs(x_hat - x_t))",
        "A_freq_128": "mean_channel(abs(delta_LH) + abs(delta_HL) + abs(delta_HH) + gamma * abs(delta_LL))",
        "A_freq_256": "bilinear_x2(A_freq_128, align_corners=False)",
        "u": "M_256 * (0.5 * A_rgb + 0.5 * A_freq_256)",
        "A": "clip(u / 2.0, 0.0, 1.0)",
        "channel_mean_basis": "A10 D10.5 (channel mean, then bilinear x2)",
        "consistent_with": "A10 D10.4 (owner-confirmed whole-u normalization)"
      }
    },
