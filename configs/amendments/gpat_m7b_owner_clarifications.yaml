  "implementation_clarifications": {
    "GRADSCALER_TOPOLOGY": {
      "class": "IMPLEMENTATION_CLARIFICATION",
      "scientific_deviation": false,
      "basis": "spec 10.5 requires GradScaler but does not define scaler ownership",
      "G_SCALER": "owns the G_OPT update path only",
      "D_SCALER": "owns the D_OPT update path only",
      "WARMUP_SCALER": "owns WARMUP_OPT (B1/B3 attack warmup); its state is never reused by G_SCALER",
      "independent_state_machines": true,
      "per_optimizer_sequence": [
        "scaler.scale(loss).backward()",
        "scaler.unscale_(optimizer)",
        "clip_grad_norm_(that optimizer's trainable parameters, 1.0)",
        "scaler.step(optimizer)",
        "scaler.update()"
      ],
      "accumulation_boundary": "respects the frozen A10 D15 accumulation boundary",
      "reason": "overflow/skip state of one optimizer never couples to another; the objective is unchanged"
    }
  },
