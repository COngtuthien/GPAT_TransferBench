scientific_contract_modified_by_this_file: false
execution_host: student20261@100.121.84.44
execution_gpu: NVIDIA GeForce RTX 3090
deviation: EXECUTION_HOST_DEVIATION_PENDING_OWNER_RECORD   # recorded in the owner resolution

storage:
  # The approved GPU runtime root. Only the physical prefix differs from the laptop config; the
  # logical role name is unchanged, and scientific identity never depends on either string.
  runtime_root: /home/student20261/workdir/GPAT_TransferBench_runtime
  roots:
    # M5 reads the canonical faces and nothing else. The M2 frames, geometry and identity caches
    # are deliberately ABSENT here: they were not transferred to the GPU host and M5 does not need
