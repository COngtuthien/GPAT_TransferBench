# M5 execution configuration — OPERATIONAL / INFRASTRUCTURE ONLY.
#
# This file names WHERE the frozen M2 canonical faces physically live for the approved RTX 3090
# execution host. It carries NO scientific value: sample membership, labels, splits, preprocessing,
# the model, the loss, the optimizer, the scheduler, the seeds, the validation policy and the
# checkpoint-selection policy all come from configs/frozen/artifact_probe.yaml, which this file
# does not touch and may not override.
#
# Selected at runtime with:
#   GPAT_M5_EXEC_CONFIG=configs/execution/m5_gpu_3090.yaml
# When that variable is unset the historical laptop config is used instead, so laptop behaviour is
# unchanged. The selected file is always passed through gpatbench.preprocess.m2b.resolve_roots(),
# so the runtime-root containment firewall still applies. No symlink is used anywhere.
#
# Owner resolution: outputs/audit/M5_GPU_EXECUTION_OWNER_RESOLUTION.md
