    faces_256_root: /home/student20261/workdir/GPAT_TransferBench_runtime/data/processed/faces_256
  runstate_root: /home/student20261/workdir/GPAT_TransferBench_runtime/runstate
  tmp_root: /home/student20261/workdir/GPAT_TransferBench_runtime/tmp
  logical_roles:                        # role -> project-relative logical name (audit/reporting)
    faces_256_root: data/processed/faces_256
  containment: all physical roots must resolve inside runtime_root
  symlinks_used: false                  # no project or runtime directory is replaced by a symlink
  faces_expected_png: 20615             # M2 COMPLETE samples; verified by SHA256 on the GPU host
  roots_not_declared_because_m5_does_not_read_them:
    - processed_frames_root
    - geometry_cache_root
    - identity_cache_root

reads_only:
  - data/processed/faces_256            # read-only; M5 never writes into the runtime root
writes:
