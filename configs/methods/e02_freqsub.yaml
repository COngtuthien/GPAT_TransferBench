# ---------------------------------------------------------------- generation contract
generation:
  input_resolution: 256
  n_syn_intended: 8838
  block_grid: [16, 16]
  eligible_band: "0.20 <= normalised radius <= 0.50"
  n_eligible_frozen_geometry: 159
  fraction: 0.25

# ---------------------------------------------------------------- A2-02 block count
block_count_rule:
  rule: ROUND_HALF_UP
  general_form: "k = round_half_up(n_eligible * 0.25)"
  integer_implementation: "k = (n_eligible + 2) // 4"
  float_free: true
  k_frozen_geometry: 40
  frozen_as_a_rule_not_as_the_number_40: true
  worked_verification: {156: 39, 157: 39, 158: 40, 159: 40, 160: 40}

# ---------------------------------------------------------------- A2-03 selection
block_selection:
  canonical_eligible_enumeration:
    - scan the 16x16 block grid in ROW-MAJOR order
    - block_row ascending first
    - within each row, block_col ascending
    - retain only eligible blocks in that order; positions are indices 0..n_eligible-1
  rng: "numpy.random.Generator(numpy.random.PCG64(pair_seed))"
  draw: "rng.choice(n_eligible, size=k, replace=False)"
  replacement: false
  scientific_result: THE_SELECTED_SET
  returned_order_carries_meaning: false
  canonical_processing_order: SORT_SELECTED_INDICES_ASCENDING_BEFORE_SUBSTITUTION
  forbidden: [numpy_default_rng_without_naming_pcg64, python_random_sample, hash_ranking]
  numpy_version_pin_required_at_runtime: true
  numpy_version_observed_during_audit: "2.5.3"
  numpy_version_observed_is_authoritative_pin: false

# ---------------------------------------------------------------- A2-04 pair seed
pair_seed:
  namespace: "gpatbench.freqsub.block.v1"
  namespace_distinct_from_e01: true
  global_seed_meaning: CURRENT_EXPERIMENT_SEED
  global_seed_domain: [42, 1337, 2026]
  preimage: "UTF-8(\"gpatbench.freqsub.block.v1|\" + pair_id + \"|\" + decimal_string(global_seed))"
  digest: "SHA256(preimage).digest()"
  pair_seed: "unsigned big-endian integer of the FULL 32-byte digest"
  passed_directly_to: "numpy.random.PCG64(pair_seed)"
  truncation: false
  modulo: false
  hidden_separator: false
  whitespace: false
  newline: false
  worked_example:
    pair_id: PTR000001
    seed_42_preimage: "gpatbench.freqsub.block.v1|PTR000001|42"
    seed_42_pair_seed: "19354000309184887456743517179028239418116648094833629759175866349341962868907"

