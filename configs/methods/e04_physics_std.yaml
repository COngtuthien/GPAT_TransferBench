# ---------------------------------------------------------------- A3 §4: controlled reconstruction
controlled_reconstruction:
  amendment: A3
  contract_class: BENCHMARK_DEFINED_CONTROLLED_RECONSTRUCTION_UNDER_OWNER_AUTHORIZATION
  owner_approved_direction: controlled reconstruction for E04
  owner_specified_each_technical_value: false
  original_authors_specified_these_details: false
  depth_target_M0:
    K: 32
    spoof_M0: ZEROS_32x32
    spoof_M0_provenance: PAPER_EQ_21
    live_M0_provenance: PAPER_EQ_21_FACE_LIKE_SHAPE_IN_0_1
    reconstruction_scope: LIVE_FACES_ONLY
    working_frame: canonical_256
    mesh: "recon_vers(dense_flag=True): R @ (u + w_shp*a_shp + w_exp*a_exp).reshape(3,-1,order='F') + offset"
    projection: official_similar_transform
    z_convention: RELATIVE_SURFACE_DEPTH_ORIGIN_AT_NEAREST_VERTEX
    visible_surface: Z_BUFFER_INIT_NEG_1E8_LARGER_Z_WINS
    rasterization: official_Sim3DR_rasterize_at_pinned_commit
    normalization: "per-sample min-max over all mesh vertices -> [0,1]"
    background: 0
    face_mask: z_buffer_written_mask_stored_alongside
    resize_256_to_32: cv2.INTER_AREA
    clip: [0, 1]
    dtype: float32
    benchmark_defined_steps: [working_frame, face_mask, resize_256_to_32, clip]
  q140_vertex_set:
    Q: 140
    frozen_list: outputs/audit/M6A5_E04_Q140_VERTEX_SET.json
    vertex_indices_sha256: 1b884401377f5aadd3d56857f05fddf70e2c54a52a9eb2160cebc06a74031a1f
    reproducer: tools/m6a5_e04_q140_derive.py
    image_independent: true
    rederived_per_experiment_seed: false
    anchors: "keypoints.reshape(68,3)[:,0] // 3  (68 iBUG landmark vertices)"
    candidate_mask: "canonical (x,y) inside-or-on the 2D convex hull of the 68 anchors"
    extension: "farthest-point sampling to 140, Euclidean 3D on the canonical neutral mesh"
    tie_break: smallest_vertex_index
    ordering: "68 anchors in iBUG order, then 72 FPS picks in selection order"

